name: Build and Publish Docker Image

on:
  push:
    branches: [ "main" ]
    tags: [ "v*", "[0-9]*" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history needed for rev-list --count

      - name: Set version build args
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            # Tagged release — use the tag as a clean version, no build time
            echo "GIT_VERSION=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "BUILD_TIME=" >> $GITHUB_OUTPUT
          else
            # Dev/main branch push — commit count + short hash + UTC build time
            COUNT=$(git rev-list --count HEAD)
            SHORT=$(git rev-parse --short HEAD)
            echo "GIT_VERSION=${COUNT}.${SHORT}" >> $GITHUB_OUTPUT
            echo "BUILD_TIME=$(date -u +%H:%M)" >> $GITHUB_OUTPUT
          fi

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GIT_VERSION=${{ steps.version.outputs.GIT_VERSION }}
            BUILD_TIME=${{ steps.version.outputs.BUILD_TIME }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}
