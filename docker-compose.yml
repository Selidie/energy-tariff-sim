# docker-compose.yml — energy-tariff-sim (production)
#
# Pulls the published image from GitHub Container Registry and runs the
# energy tariff simulator as a standalone service.
#
# Prerequisites:
#   - Docker and Docker Compose installed
#   - An mqtt-bridge instance running with InfluxDB enabled
#     (see https://github.com/selidie/mqtt-bridge)
#   - Update config/settings.yaml with your mqtt-bridge URL and tariffs
#     before starting for the first time
#
# Usage:
#   docker compose pull          # pull the latest image
#   docker compose up -d         # start the service
#   docker compose logs -f       # tail logs
#   docker compose down          # stop and remove the container

services:
  energy-tariff-sim:
    image: ghcr.io/selidie/energy-tariff-sim:latest
    container_name: energy-tariff-sim
    restart: unless-stopped
    ports:
      - "5011:5011"
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      # Required for Solar Assistant backup import (sa_import.py spins up a
      # temporary InfluxDB 1.x container via the Docker CLI)
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - PORT=5011
      - CONFIG_PATH=/app/config/settings.yaml
      # Solar Assistant import — InfluxDB 2.x connection (same as mqtt-bridge)
      # Uncomment and set these if INFLUX_URL / INFLUX_TOKEN are not already
      # present in your environment or passed another way:
      # - INFLUX_URL=http://your-influxdb-host:8086
      # - INFLUX_TOKEN=your_influxdb_token
      # - INFLUX_ORG=home
      # - INFLUX_BUCKET=solar
      #
      # Solar Assistant import — staging paths are resolved automatically at
      # runtime by inspecting this container's own mounts via `docker inspect`.
      # You only need to set these if auto-resolution doesn't work for your setup:
      # - STAGING_CONTAINER_DIR=/app/data/sa_staging
      # - STAGING_HOST_DIR=/override/host/path/to/data/sa_staging
