<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Energy Tariff Simulator — Config</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --border: #2e3250;
    --accent: #4f8ef7;
    --accent2: #34d399;
    --danger: #f87171;
    --warning: #fbbf24;
    --gold: #f59e0b;
    --text: #e2e8f0;
    --muted: #8892aa;
    --font: 'Inter', system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; }

  header {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 16px 24px; display: flex; align-items: center; gap: 12px;
  }
  header h1 { font-size: 18px; font-weight: 600; }
  .nav-links { margin-left: auto; display: flex; gap: 8px; }
  .nav-links a {
    padding: 6px 14px; border-radius: 6px; font-size: 13px; font-weight: 500;
    text-decoration: none; color: var(--muted); border: 1px solid transparent; transition: all .15s;
  }
  .nav-links a:hover { color: var(--text); border-color: var(--border); }
  .nav-links a.active { color: var(--accent); border-color: var(--accent); background: rgba(79,142,247,.08); }

  main { max-width: 860px; margin: 0 auto; padding: 28px 24px; }

  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 22px 24px; margin-bottom: 20px;
  }
  .card-header {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px;
  }
  .card-header h2 { font-size: 15px; font-weight: 600; }
  .section-label {
    font-size: 11px; font-weight: 600; color: var(--muted);
    text-transform: uppercase; letter-spacing: .07em; margin-bottom: 12px; margin-top: 20px;
  }
  .section-label:first-child { margin-top: 0; }

  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; font-weight: 500; color: var(--muted); margin-bottom: 5px; }
  .field input, .field select {
    width: 100%; background: var(--surface2); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 8px 11px; font-size: 13px; outline: none; transition: border-color .15s;
  }
  .field input:focus, .field select:focus { border-color: var(--accent); }
  .field .hint { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .row { display: grid; gap: 12px; }
  .row-2 { grid-template-columns: 1fr 1fr; }
  .row-3 { grid-template-columns: 1fr 1fr 1fr; }

  button {
    padding: 8px 18px; border-radius: 6px; border: none;
    cursor: pointer; font-size: 13px; font-weight: 500; transition: opacity .15s, background .15s;
  }
  button:hover { opacity: .85; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  .btn-primary   { background: var(--accent); color: #fff; }
  .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
  .btn-danger    { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
  .btn-ghost     { background: transparent; color: var(--accent); border: 1px solid var(--border); }
  .btn-warn      { background: transparent; color: var(--warning); border: 1px solid var(--warning); }
  .btn-gold      { background: rgba(245,158,11,.12); color: var(--gold); border: 1px solid var(--gold); }
  .btn-sm        { padding: 5px 12px; font-size: 12px; }

  /* Diagnose */
  #diag-panel {
    margin-top: 16px; background: #0a0c12; border: 1px solid var(--border);
    border-radius: 8px; padding: 14px 16px; font-size: 12px; display: none;
  }
  #diag-panel.visible { display: block; }
  .diag-row { display: flex; align-items: baseline; gap: 10px; padding: 5px 0; border-bottom: 1px solid var(--border); }
  .diag-row:last-child { border-bottom: none; }
  .diag-label { color: var(--muted); min-width: 130px; flex-shrink: 0; }
  .diag-value { color: var(--text); font-family: monospace; word-break: break-all; }
  .diag-ok  { color: var(--accent2); }
  .diag-err { color: var(--danger); }
  .diag-warn{ color: var(--warning); }
  .topic-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; margin-top: 10px; }
  .topic-chip { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 7px 10px; font-size: 11px; }
  .topic-chip .tc-label { color: var(--muted); margin-bottom: 2px; }
  .topic-chip .tc-path  { color: var(--text); font-family: monospace; font-size: 10px; word-break: break-all; }
  .topic-chip .tc-val   { font-family: monospace; font-size: 11px; margin-top: 3px; }
  .topic-chip.found   { border-color: #1a3a2a; }
  .topic-chip.missing { border-color: #3a1a1a; }

  /* Tariff list */
  #tariff-list { display: flex; flex-direction: column; gap: 12px; }
  .tariff-card {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; overflow: hidden; transition: border-color .2s;
  }
  .tariff-card.is-baseline { border-color: var(--gold); }
  .tariff-header {
    display: flex; align-items: center; gap: 10px; padding: 12px 16px;
    cursor: pointer; user-select: none;
  }
  .tariff-header:hover { background: rgba(255,255,255,.03); }
  .tariff-chevron { color: var(--muted); font-size: 12px; transition: transform .2s; }
  .tariff-chevron.open { transform: rotate(90deg); }
  .tariff-title { font-weight: 600; font-size: 13px; flex: 1; }
  .tariff-badges { display: flex; gap: 6px; align-items: center; }
  .tariff-badge { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 4px; }
  .badge-flat       { background: #1e3a5f; color: var(--accent); }
  .badge-day_night  { background: #1a3347; color: #67e8f9; }
  .badge-baseline   { background: rgba(245,158,11,.15); color: var(--gold); border: 1px solid rgba(245,158,11,.3); }
  .tariff-body { padding: 16px; border-top: 1px solid var(--border); display: none; }
  .tariff-body.open { display: block; }
  .tariff-actions { display: flex; gap: 8px; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border); align-items: center; }
  .tariff-actions .spacer { flex: 1; }

  .fields-flat, .fields-e7 { display: none; }
  .fields-flat.active, .fields-e7.active { display: block; }

  /* Save bar */
  #save-bar {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 20px;
    display: flex; align-items: center; gap: 16px;
    box-shadow: 0 8px 32px rgba(0,0,0,.5);
    opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 100;
  }
  #save-bar.visible { opacity: 1; pointer-events: all; }
  #save-bar span { font-size: 13px; color: var(--muted); }

  #toast {
    position: fixed; top: 20px; right: 20px;
    padding: 10px 18px; border-radius: 8px; font-size: 13px; font-weight: 500;
    opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 200;
  }
  #toast.ok  { background: #064e3b; color: var(--accent2); border: 1px solid #065f46; opacity: 1; }
  #toast.err { background: #7f1d1d; color: var(--danger);  border: 1px solid #991b1b; opacity: 1; }

  .empty-state { text-align: center; padding: 32px; color: var(--muted); font-size: 13px; }
  .empty-state svg { display: block; margin: 0 auto 12px; opacity: .3; }

  .spinner {
    display: inline-block; width: 12px; height: 12px;
    border: 2px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: spin .7s linear infinite; vertical-align: middle; margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header>
  <h1>⚡ Energy Tariff Simulator</h1>
  <nav class="nav-links">
    <a href="/">Simulator</a>
    <a href="/config" class="active">Config</a>
  </nav>
</header>

<main>

  <!-- MQTT Bridge & Timezone -->
  <div class="card">
    <div class="card-header">
      <h2>🔌 MQTT Bridge</h2>
      <div style="display:flex;align-items:center;gap:10px">
        <span id="bridge-status" style="font-size:12px;color:var(--muted)">checking…</span>
        <button class="btn-warn btn-sm" onclick="runDiagnose()">🔍 Diagnose</button>
      </div>
    </div>
    <div class="row row-3">
      <div class="field">
        <label>Bridge IP / Hostname</label>
        <input type="text" id="mqtt-host" placeholder="mqtt-bridge" />
        <div class="hint">Hostname or IP of the MQTT bridge</div>
      </div>
      <div class="field">
        <label>Port</label>
        <input type="number" id="mqtt-port" placeholder="5003" min="1" max="65535" />
        <div class="hint">HTTP API port (default 5003)</div>
      </div>
      <div class="field">
        <label>Timezone</label>
        <select id="timezone">
          <optgroup label="United Kingdom">
            <option value="Europe/London">Europe/London (UK)</option>
          </optgroup>
          <optgroup label="Europe">
            <option value="Europe/Paris">Europe/Paris (CET)</option>
            <option value="Europe/Berlin">Europe/Berlin (CET)</option>
            <option value="Europe/Amsterdam">Europe/Amsterdam</option>
            <option value="Europe/Madrid">Europe/Madrid</option>
            <option value="Europe/Rome">Europe/Rome</option>
            <option value="Europe/Stockholm">Europe/Stockholm</option>
            <option value="Europe/Helsinki">Europe/Helsinki (EET)</option>
            <option value="Europe/Athens">Europe/Athens</option>
            <option value="Europe/Moscow">Europe/Moscow</option>
          </optgroup>
          <optgroup label="Americas">
            <option value="America/New_York">America/New_York (ET)</option>
            <option value="America/Chicago">America/Chicago (CT)</option>
            <option value="America/Denver">America/Denver (MT)</option>
            <option value="America/Los_Angeles">America/Los_Angeles (PT)</option>
            <option value="America/Toronto">America/Toronto</option>
            <option value="America/Vancouver">America/Vancouver</option>
          </optgroup>
          <optgroup label="Asia / Pacific">
            <option value="Asia/Dubai">Asia/Dubai (GST)</option>
            <option value="Asia/Kolkata">Asia/Kolkata (IST)</option>
            <option value="Asia/Singapore">Asia/Singapore (SGT)</option>
            <option value="Asia/Tokyo">Asia/Tokyo (JST)</option>
            <option value="Australia/Sydney">Australia/Sydney (AEST)</option>
            <option value="Australia/Perth">Australia/Perth (AWST)</option>
            <option value="Pacific/Auckland">Pacific/Auckland (NZST)</option>
          </optgroup>
          <optgroup label="Other">
            <option value="UTC">UTC</option>
          </optgroup>
        </select>
        <div class="hint">Used for billing boundaries &amp; Economy 7 windows</div>
      </div>
    </div>
    <div id="diag-panel">
      <div id="diag-content"><span class="spinner"></span> Running diagnostics…</div>
    </div>
  </div>

  <!-- Tariffs -->
  <div class="card">
    <div class="card-header">
      <h2>⚡ Tariffs</h2>
      <div style="display:flex;gap:8px">
        <button class="btn-ghost btn-sm" onclick="addTariff('flat')">+ Flat Rate</button>
        <button class="btn-ghost btn-sm" onclick="addTariff('day_night')">+ Economy 7</button>
      </div>
    </div>
    <div id="tariff-list">
      <div class="empty-state" id="empty-msg">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/></svg>
        No tariffs configured. Add one above.
      </div>
    </div>
  </div>

</main>

<div id="save-bar">
  <span>You have unsaved changes</span>
  <button class="btn-secondary btn-sm" onclick="discardChanges()">Discard</button>
  <button class="btn-primary btn-sm" onclick="saveConfig()">Save Changes</button>
</div>

<div id="toast"></div>

<script>
let _tariffs     = [];
let _baselineId  = '';
let _dirty       = false;

(async function init() {
  await loadConfig();
  checkBridgeStatus();
})();

// ── Load config ────────────────────────────────────────────────────────────
async function loadConfig() {
  try {
    const r = await fetch('/api/config');
    const d = await r.json();
    if (!d.success) throw new Error(d.error);
    const cfg = d.config;

    // MQTT
    const url = cfg?.mqtt?.api_url || '';
    const m = url.match(/https?:\/\/([^:]+):?(\d*)/);
    if (m) {
      document.getElementById('mqtt-host').value = m[1];
      document.getElementById('mqtt-port').value = m[2] || '5003';
    }

    // Timezone
    const tz = cfg?.simulation?.timezone || 'Europe/London';
    const tzSel = document.getElementById('timezone');
    const opt = [...tzSel.options].find(o => o.value === tz);
    if (opt) tzSel.value = tz;
    else tzSel.add(new Option(tz, tz, true, true));

    // Baseline
    _baselineId = cfg?.simulation?.baseline_tariff_id || '';

    // Tariffs
    _tariffs = (cfg?.tariffs || []).map(normaliseLoaded);

    // If no baseline set yet, default to first tariff
    if (!_baselineId && _tariffs.length) {
      _baselineId = _tariffs[0].id || slugify(_tariffs[0].name);
    }

    renderTariffs();
    attachChangeListeners();
    _dirty = false;
    updateSaveBar();
  } catch(e) {
    toast('Failed to load config: ' + e.message, 'err');
  }
}

function normaliseLoaded(t) {
  const base = {
    id: t.id || '', name: t.name || '',
    type: t.type === 'flat' ? 'flat' : 'day_night',
    standing_charge: String(t.standing_charge ?? ''),
    export_rate: String(t.export_rate ?? ''),
    _open: false,
  };
  if (t.type === 'flat') {
    base.import_rate = String(t.import_rate ?? '');
  } else {
    base.day_rate    = String(t.day?.rate   ?? '');
    base.night_rate  = String(t.night?.rate ?? '');
    base.night_start = t.night?.start || '00:00';
    base.night_end   = t.night?.end   || '07:00';
  }
  return base;
}

// ── Tariff rendering ───────────────────────────────────────────────────────
function renderTariffs() {
  const list = document.getElementById('tariff-list');
  document.getElementById('empty-msg').style.display = _tariffs.length ? 'none' : '';
  list.querySelectorAll('.tariff-card').forEach(el => el.remove());

  _tariffs.forEach((t, i) => {
    // Ensure stable ID for baseline comparison
    const tid        = t.id || slugify(t.name);
    const isBaseline = tid === _baselineId;
    const typeLabel  = t.type === 'flat' ? 'Flat Rate' : 'Economy 7';
    const badgeClass = t.type === 'flat' ? 'badge-flat' : 'badge-day_night';

    const card = document.createElement('div');
    card.className = `tariff-card${isBaseline ? ' is-baseline' : ''}`;
    card.dataset.idx = i;

    card.innerHTML = `
      <div class="tariff-header" onclick="toggleTariff(${i})">
        <span class="tariff-chevron ${t._open ? 'open' : ''}">▶</span>
        <span class="tariff-title">${escHtml(t.name || 'Unnamed Tariff')}</span>
        <span class="tariff-badges">
          ${isBaseline ? '<span class="tariff-badge badge-baseline">★ Current Tariff</span>' : ''}
          <span class="tariff-badge ${badgeClass}">${typeLabel}</span>
        </span>
      </div>
      <div class="tariff-body ${t._open ? 'open' : ''}">
        <div class="row row-2">
          <div class="field">
            <label>Tariff Name</label>
            <input type="text" data-field="name" value="${escHtml(t.name)}" placeholder="e.g. Standard Variable" />
          </div>
          <div class="field">
            <label>Type</label>
            <select data-field="type" onchange="onTypeChange(${i}, this.value)">
              <option value="flat"      ${t.type==='flat'      ? 'selected':''}>Flat Rate</option>
              <option value="day_night" ${t.type==='day_night' ? 'selected':''}>Economy 7</option>
            </select>
          </div>
        </div>

        <div class="fields-flat ${t.type === 'flat' ? 'active' : ''}">
          <div class="section-label">Import / Export</div>
          <div class="row row-2">
            <div class="field">
              <label>Fixed Price per kWh (p)</label>
              <input type="number" step="0.01" min="0" data-field="import_rate" value="${t.import_rate ?? ''}" placeholder="24.50" />
            </div>
            <div class="field">
              <label>Export Rate per kWh (p)</label>
              <input type="number" step="0.01" min="0" data-field="export_rate" value="${t.export_rate ?? ''}" placeholder="15.00" />
            </div>
          </div>
          <div class="section-label">Standing Charge</div>
          <div class="row row-2">
            <div class="field">
              <label>Daily Charge (p/day)</label>
              <input type="number" step="0.01" min="0" data-field="standing_charge" value="${t.standing_charge ?? ''}" placeholder="53.37" />
            </div>
          </div>
        </div>

        <div class="fields-e7 ${t.type === 'day_night' ? 'active' : ''}">
          <div class="section-label">Rates</div>
          <div class="row row-2">
            <div class="field">
              <label>Day Rate per kWh (p)</label>
              <input type="number" step="0.01" min="0" data-field="day_rate" value="${t.day_rate ?? ''}" placeholder="28.62" />
            </div>
            <div class="field">
              <label>Night Rate per kWh (p)</label>
              <input type="number" step="0.01" min="0" data-field="night_rate" value="${t.night_rate ?? ''}" placeholder="13.10" />
            </div>
          </div>
          <div class="section-label">Night Rate Window</div>
          <div class="row row-3">
            <div class="field">
              <label>Night Starts</label>
              <input type="time" data-field="night_start" value="${t.night_start || '00:00'}" />
              <div class="hint">When cheap rate begins</div>
            </div>
            <div class="field">
              <label>Night Ends</label>
              <input type="time" data-field="night_end" value="${t.night_end || '07:00'}" />
              <div class="hint">When day rate resumes</div>
            </div>
            <div class="field">
              <label>Export Rate per kWh (p)</label>
              <input type="number" step="0.01" min="0" data-field="export_rate" value="${t.export_rate ?? ''}" placeholder="15.00" />
            </div>
          </div>
          <div class="section-label">Standing Charge</div>
          <div class="row row-2">
            <div class="field">
              <label>Daily Charge (p/day)</label>
              <input type="number" step="0.01" min="0" data-field="standing_charge" value="${t.standing_charge ?? ''}" placeholder="53.37" />
            </div>
          </div>
        </div>

        <div class="tariff-actions">
          ${isBaseline
            ? `<span style="font-size:12px;color:var(--gold)">★ This is your current tariff — used as the comparison baseline</span>`
            : `<button class="btn-gold btn-sm" onclick="setBaseline(${i})">★ Set as Current Tariff</button>`}
          <span class="spacer"></span>
          <button class="btn-danger btn-sm" onclick="removeTariff(${i})">Remove</button>
        </div>
      </div>`;

    card.querySelectorAll('[data-field]').forEach(el => {
      el.addEventListener('input', () => {
        const field = el.dataset.field;
        _tariffs[i][field] = el.value;
        if (field === 'name') card.querySelector('.tariff-title').textContent = el.value || 'Unnamed Tariff';
        markDirty();
      });
    });

    list.appendChild(card);
  });
}

function setBaseline(i) {
  const tid = _tariffs[i].id || slugify(_tariffs[i].name);
  _baselineId = tid;
  renderTariffs();
  markDirty();
}

function toggleTariff(i) { _tariffs[i]._open = !_tariffs[i]._open; renderTariffs(); }
function onTypeChange(i, val) { _tariffs[i].type = val; renderTariffs(); markDirty(); }

function addTariff(type) {
  const defaults = type === 'flat'
    ? { import_rate: '', export_rate: '', standing_charge: '' }
    : { day_rate: '', night_rate: '', night_start: '00:00', night_end: '07:00', export_rate: '', standing_charge: '' };
  _tariffs.push({ id: '', name: '', type, _open: true, ...defaults });
  renderTariffs();
  markDirty();
}

function removeTariff(i) {
  const removedId = _tariffs[i].id || slugify(_tariffs[i].name);
  _tariffs.splice(i, 1);
  // If baseline was removed, default to first remaining
  if (removedId === _baselineId && _tariffs.length) {
    _baselineId = _tariffs[0].id || slugify(_tariffs[0].name);
  }
  renderTariffs();
  markDirty();
}

// ── Diagnose ───────────────────────────────────────────────────────────────
async function runDiagnose() {
  const panel = document.getElementById('diag-panel');
  const content = document.getElementById('diag-content');
  panel.classList.add('visible');
  content.innerHTML = '<span class="spinner"></span> Running diagnostics…';
  try {
    const d = await (await fetch('/api/bridge/diagnose')).json();
    if (!d.success) {
      content.innerHTML = `<div class="diag-row"><span class="diag-label">Error</span><span class="diag-value diag-err">${escHtml(d.error)}</span></div>`;
      return;
    }
    const mqttOk = d.mqtt_connected, influxOk = d.influx_enabled, readyOk = d.ingest_ready;
    let html = `
      <div class="diag-row"><span class="diag-label">Bridge URL</span><span class="diag-value">${escHtml(d.bridge_url)}</span></div>
      <div class="diag-row"><span class="diag-label">MQTT Broker</span><span class="diag-value">${escHtml(d.broker||'—')}</span></div>
      <div class="diag-row"><span class="diag-label">MQTT Connected</span><span class="diag-value ${mqttOk?'diag-ok':'diag-err'}">${mqttOk?'✓ Yes':'✗ No'}</span></div>
      <div class="diag-row"><span class="diag-label">InfluxDB Enabled</span><span class="diag-value ${influxOk?'diag-ok':'diag-err'}">${influxOk?'✓ Yes':'✗ No — ingest requires InfluxDB'}</span></div>
      <div class="diag-row"><span class="diag-label">Topics on Bridge</span><span class="diag-value">${d.topic_count} topic(s) under <code>${escHtml(d.prefix)}</code></span></div>
      <div class="diag-row"><span class="diag-label">Ingest Ready</span><span class="diag-value ${readyOk?'diag-ok':'diag-warn'}">${readyOk?'✓ All checks passed':'⚠ See topic status below'}</span></div>`;
    const topics = d.configured_topics || {};
    const keys = Object.keys(topics);
    if (keys.length) {
      html += `<div style="margin-top:12px;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px">Configured Topics</div><div class="topic-grid">`;
      for (const [label, info] of Object.entries(topics)) {
        const found = info.found;
        html += `<div class="topic-chip ${found?'found':'missing'}">
          <div class="tc-label" style="color:${found?'var(--accent2)':'var(--danger)'}">${found?'✓':'✗'} ${escHtml(label)}</div>
          <div class="tc-path">${escHtml(info.full_topic)}</div>
          ${found ? `<div class="tc-val" style="color:var(--accent2)">${escHtml(String(info.latest_value??'—'))} <span style="color:var(--muted)">@ ${escHtml(info.latest_ts||'—')}</span></div>`
                  : `<div class="tc-val" style="color:var(--danger)">Not found in bridge</div>`}
        </div>`;
      }
      html += `</div>`;
    }
    if (keys.some(k => !topics[k].found)) {
      try {
        const nd = await (await fetch('/api/bridge/topics/numeric')).json();
        if (nd.success && nd.topics.length) {
          html += `<div style="margin-top:14px;font-size:11px;font-weight:600;color:var(--warning);text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px">⚠ Available Numeric Topics</div>`;
          html += `<div style="background:var(--surface2);border-radius:6px;padding:10px 12px;font-family:monospace;font-size:11px;color:var(--text);max-height:200px;overflow-y:auto;line-height:1.8">${nd.topics.map(t=>escHtml(t)).join('<br>')}</div>`;
        }
      } catch {}
    }
    content.innerHTML = html;
  } catch(e) {
    content.innerHTML = `<div class="diag-row"><span class="diag-label">Error</span><span class="diag-value diag-err">${escHtml(e.message)}</span></div>`;
  }
}

// ── Change tracking ────────────────────────────────────────────────────────
function attachChangeListeners() {
  ['mqtt-host', 'mqtt-port', 'timezone'].forEach(id => {
    document.getElementById(id)?.addEventListener('input',  markDirty);
    document.getElementById(id)?.addEventListener('change', markDirty);
  });
}

function markDirty()    { _dirty = true;  updateSaveBar(); }
function updateSaveBar(){ document.getElementById('save-bar').classList.toggle('visible', _dirty); }
function discardChanges(){ _dirty = false; updateSaveBar(); loadConfig(); }

// ── Save ───────────────────────────────────────────────────────────────────
async function saveConfig() {
  const host = document.getElementById('mqtt-host').value.trim();
  const port = document.getElementById('mqtt-port').value.trim() || '5003';
  const tz   = document.getElementById('timezone').value;

  // Assign stable IDs to any tariff that doesn't have one yet
  _tariffs.forEach(t => { if (!t.id) t.id = slugify(t.name); });

  const payload = {
    mqtt_host:           host,
    mqtt_port:           port,
    timezone:            tz,
    baseline_tariff_id:  _baselineId,
    tariffs: _tariffs.map(t => {
      const base = {
        id:              t.id || slugify(t.name),
        name:            t.name,
        type:            t.type,
        standing_charge: parseFloat(t.standing_charge) || 0,
        export_rate:     parseFloat(t.export_rate) || 0,
      };
      if (t.type === 'flat') {
        base.import_rate = parseFloat(t.import_rate) || 0;
      } else {
        base.day_rate    = parseFloat(t.day_rate) || 0;
        base.night_rate  = parseFloat(t.night_rate) || 0;
        base.night_start = t.night_start || '00:00';
        base.night_end   = t.night_end   || '07:00';
      }
      return base;
    }),
  };

  try {
    const r = await fetch('/api/config', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    const d = await r.json();
    if (!d.success) throw new Error(d.error);
    toast('Configuration saved ✓', 'ok');
    _dirty = false;
    updateSaveBar();
    checkBridgeStatus();
  } catch(e) {
    toast('Save failed: ' + e.message, 'err');
  }
}

// ── Bridge status ──────────────────────────────────────────────────────────
async function checkBridgeStatus() {
  const el = document.getElementById('bridge-status');
  try {
    const d = await (await fetch('/health')).json();
    const b = d.bridge;
    if (b?.ok) { el.textContent = '● Connected'; el.style.color = 'var(--accent2)'; }
    else        { el.textContent = '● ' + (b?.reason || 'Unreachable'); el.style.color = 'var(--danger)'; }
  } catch {
    el.textContent = '● API unreachable'; el.style.color = 'var(--danger)';
  }
}

function slugify(s) {
  return (s || '').toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '') || 'tariff_' + Date.now();
}
function escHtml(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

let _toastTimer;
function toast(msg, type) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.className = type;
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => { el.className = ''; }, 3500);
}

setInterval(checkBridgeStatus, 30000);
</script>
</body>
</html>
