<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Energy Tariff Simulator</title>
<style>
  :root {
    --bg: #0f1117; --surface: #1a1d27; --surface2: #22263a; --border: #2e3250;
    --accent: #4f8ef7; --accent2: #34d399; --danger: #f87171; --warning: #fbbf24;
    --gold: #f59e0b; --text: #e2e8f0; --muted: #8892aa; --font: 'Inter', system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; }
  header {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 16px 24px; display: flex; align-items: center; gap: 12px;
  }
  header h1 { font-size: 18px; font-weight: 600; }
  header span { color: var(--muted); font-size: 13px; }
  #status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
  #status-dot.ok  { background: var(--accent2); }
  #status-dot.err { background: var(--danger); }
  .nav-links { margin-left: auto; display: flex; gap: 8px; }
  .nav-links a {
    padding: 6px 14px; border-radius: 6px; font-size: 13px; font-weight: 500;
    text-decoration: none; color: var(--muted); border: 1px solid transparent; transition: all .15s;
  }
  .nav-links a:hover { color: var(--text); border-color: var(--border); }
  .nav-links a.active { color: var(--accent); border-color: var(--accent); background: rgba(79,142,247,.08); }
  main { max-width: 1100px; margin: 0 auto; padding: 24px; }
  .toolbar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
  button {
    padding: 8px 18px; border-radius: 6px; border: none;
    cursor: pointer; font-size: 13px; font-weight: 500; transition: opacity .15s;
  }
  button:hover { opacity: .85; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  .btn-primary   { background: var(--accent); color: #fff; }
  .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
  .btn-danger    { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 20px; }
  .card-header-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .card-header-row h2 { font-size: 15px; font-weight: 600; }
  .card h2 { font-size: 15px; font-weight: 600; margin-bottom: 16px; }
  .summary-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .metric { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; }
  .metric .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 6px; }
  .metric .value { font-size: 22px; font-weight: 700; color: var(--text); }
  .metric .sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .metric.best .value { color: var(--accent2); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; padding: 8px 12px; color: var(--muted); font-weight: 500; border-bottom: 1px solid var(--border); }
  td { padding: 9px 12px; border-bottom: 1px solid var(--border); }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--surface2); }
  tr.row-baseline td { background: rgba(245,158,11,.04); }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
  .tag-baseline { background: rgba(245,158,11,.15); color: var(--gold); border: 1px solid rgba(245,158,11,.3); }
  .tag-save { background: #064e3b; color: var(--accent2); }
  .tag-cost { background: #7f1d1d; color: var(--danger); }
  .diff-neg { color: var(--accent2); }
  .log {
    background: #0a0c12; border: 1px solid var(--border); border-radius: 8px;
    padding: 12px 16px; font-family: 'Fira Mono', 'Cascadia Code', monospace;
    font-size: 12px; color: var(--muted); max-height: 160px; overflow-y: auto; margin-top: 8px;
  }
  .log .info { color: var(--accent); }
  .log .ok   { color: var(--accent2); }
  .log .err  { color: var(--danger); }
  select {
    background: var(--surface2); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; padding: 7px 10px; font-size: 13px; cursor: pointer;
  }
  .flex { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .saved-at { font-size: 11px; color: var(--muted); font-style: italic; }
  #spinner {
    display: inline-block; width: 14px; height: 14px;
    border: 2px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: spin .7s linear infinite; vertical-align: middle; margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Version badge ── */
  .version-badge {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 12px; color: var(--muted);
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 5px; padding: 3px 8px; white-space: nowrap;
    text-decoration: none;
  }
  .version-badge:hover { border-color: var(--accent); color: var(--text); }
  .version-badge .ver-icon { font-size: 13px; line-height: 1; }
  .version-badge.up-to-date .ver-icon { color: var(--accent2); }
  .version-badge.outdated   .ver-icon { color: var(--danger); }

  /* ── Date range row ── */
  .date-range-row {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 10px 14px; background: var(--surface2);
    border: 1px solid var(--border); border-radius: 8px; margin-bottom: 16px;
  }
  .date-range-row label { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .date-range-row input[type="date"] {
    background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 10px; font-size: 13px; font-family: inherit;
    color-scheme: dark;
  }
  .date-range-row input[type="date"]:focus { outline: none; border-color: var(--accent); }
  .date-range-sep { color: var(--muted); font-size: 12px; }
  .date-range-hint { font-size: 11px; color: var(--muted); font-style: italic; margin-left: auto; }
</style>
</head>
<body>

<header>
  <div id="status-dot"></div>
  <h1>⚡ Energy Tariff Simulator</h1>
  <a id="version-badge" class="version-badge" href="#" target="_blank" rel="noopener" title="Checking version…">
    <span class="ver-icon" id="ver-icon">○</span>
    <span id="ver-label">…</span>
  </a>
  <span id="header-status">connecting…</span>
  <nav class="nav-links">
    <a href="/" class="active">Simulator</a>
    <a href="/config">Config</a>
  </nav>
</header>

<main>

  <div class="card">
    <h2>Pipeline</h2>

    <!-- Date range selector -->
    <div class="date-range-row">
      <label for="date-from">Ingest from</label>
      <input type="date" id="date-from" />
      <span class="date-range-sep">→</span>
      <label for="date-to">to</label>
      <input type="date" id="date-to" />
      <span class="date-range-hint" id="date-range-hint">Used by Ingest &amp; Run Full Pipeline</span>
    </div>

    <div class="toolbar">
      <button class="btn-primary" onclick="runFull()">▶ Run Full Pipeline</button>
      <button class="btn-secondary" onclick="runIngest()">① Ingest</button>
      <button class="btn-secondary" onclick="runAggregate()">② Aggregate</button>
      <button class="btn-secondary" onclick="runSimulate()">③ Simulate</button>
    </div>
    <div id="log" class="log"><span class="info">Ready.</span></div>
  </div>

  <div class="card" id="compare-card">
    <div class="card-header-row">
      <h2>Tariff Comparison</h2>
      <div class="flex">
        <span class="saved-at" id="saved-at-label"></span>
        <button class="btn-danger" id="clear-btn" onclick="clearResults()" style="display:none;padding:5px 12px;font-size:12px">✕ Clear Comparison</button>
      </div>
    </div>
    <div id="compare-content"><span style="color:var(--muted)">Run the pipeline to see results.</span></div>
  </div>

  <div class="card">
    <h2>Detailed Breakdown</h2>
    <div class="flex" style="margin-bottom:16px">
      <select id="tariff-select" onchange="loadDetail()"><option value="">— select tariff —</option></select>
      <select id="view-select" onchange="loadDetail()">
        <option value="daily">Daily</option>
        <option value="monthly">Monthly</option>
        <option value="yearly">Yearly</option>
      </select>
    </div>
    <div id="detail-content"><span style="color:var(--muted)">Select a tariff above.</span></div>
  </div>

</main>

<script>
const API        = '';
const GH_REPO   = 'selidie/energy-tarriff-sim';
const GH_API_URL = `https://api.github.com/repos/${GH_REPO}/releases/latest`;
const GH_REL_URL = `https://github.com/${GH_REPO}/releases/latest`;

// ── Version / update check ────────────────────────────────────────────────

/**
 * Normalise a version string for comparison.
 * Strips a leading 'v' so "v1.2.3" == "1.2.3".
 * Returns the string as-is for dev/commit-hash builds that don't match semver.
 */
function _stripV(v) { return v ? v.replace(/^v/, '') : ''; }

async function checkVersion(currentVersion) {
  const badge   = document.getElementById('version-badge');
  const icon    = document.getElementById('ver-icon');
  const label   = document.getElementById('ver-label');

  // Show the running version immediately
  const displayVer = currentVersion && currentVersion !== 'dev'
    ? `v${_stripV(currentVersion)}`
    : currentVersion || 'dev';
  label.textContent = displayVer;
  badge.href = GH_REL_URL;

  // Dev / commit-hash builds — don't attempt a version comparison
  if (!currentVersion || currentVersion === 'dev' || /^\d+\.[a-f0-9]+$/.test(currentVersion)) {
    icon.textContent  = '○';
    badge.title = 'Dev build — no release version to compare';
    return;
  }

  try {
    const resp = await fetch(GH_API_URL, {
      headers: { Accept: 'application/vnd.github+json' },
      cache: 'no-store',
    });
    if (!resp.ok) throw new Error(`GitHub API ${resp.status}`);
    const rel        = await resp.json();
    const latest     = _stripV(rel.tag_name || '');
    const current    = _stripV(currentVersion);

    if (latest && latest === current) {
      icon.textContent = '✔';
      badge.classList.add('up-to-date');
      badge.title = `Up to date (${displayVer})`;
    } else if (latest) {
      icon.textContent = '✘';
      badge.classList.add('outdated');
      badge.title = `Update available: v${latest} (you have ${displayVer}) — click to view release`;
      label.textContent = `${displayVer} → v${latest}`;
    }
  } catch (err) {
    // Network failure, rate limit, etc. — show the version but no indicator
    icon.textContent = '○';
    badge.title = `Could not check for updates: ${err.message}`;
  }
}

// ── Date range helpers ────────────────────────────────────────────────────

function _isoToday() {
  return new Date().toISOString().slice(0, 10);
}

function _defaultFrom() {
  return '2024-06-01';
}

function initDateRange() {
  const fromEl = document.getElementById('date-from');
  const toEl   = document.getElementById('date-to');
  fromEl.value = _defaultFrom();
  toEl.value   = _isoToday();
  fromEl.max = _isoToday();
  toEl.max   = _isoToday();
  fromEl.addEventListener('change', () => {
    if (toEl.value && toEl.value < fromEl.value) toEl.value = fromEl.value;
    updateDateHint();
  });
  toEl.addEventListener('change', () => {
    if (fromEl.value && fromEl.value > toEl.value) fromEl.value = toEl.value;
    updateDateHint();
  });
  updateDateHint();
}

function updateDateHint() {
  const from = document.getElementById('date-from').value;
  const to   = document.getElementById('date-to').value;
  const hint = document.getElementById('date-range-hint');
  if (from && to) {
    const days = Math.round((new Date(to) - new Date(from)) / 86400000) + 1;
    hint.textContent = `${days} day${days !== 1 ? 's' : ''} · Used by Ingest & Run Full Pipeline`;
  } else {
    hint.textContent = 'Used by Ingest & Run Full Pipeline';
  }
}

function getDateRange() {
  return {
    date_from: document.getElementById('date-from').value || null,
    date_to:   document.getElementById('date-to').value   || null,
  };
}

// ── Logging ───────────────────────────────────────────────────────────────

const logEl = document.getElementById('log');
function log(msg, cls = '') {
  const line = document.createElement('div');
  line.innerHTML = `<span class="${cls}">${new Date().toLocaleTimeString()} ${msg}</span>`;
  logEl.appendChild(line);
  logEl.scrollTop = logEl.scrollHeight;
}

// ── Health ────────────────────────────────────────────────────────────────

let _versionChecked = false;

async function checkHealth() {
  try {
    const d = await (await fetch(`${API}/health`)).json();
    document.getElementById('status-dot').className = 'ok';
    document.getElementById('header-status').textContent =
      `API OK · ${d.tariffs?.length ?? 0} tariff(s) · ${d.history_range || '700d'} history`;

    // Version check runs only once, on the first successful health response
    if (!_versionChecked) {
      _versionChecked = true;
      checkVersion(d.version || 'dev');
    }
  } catch {
    document.getElementById('status-dot').className = 'err';
    document.getElementById('header-status').textContent = 'API unreachable';
  }
}

// ── Saved results ─────────────────────────────────────────────────────────

async function loadSavedResults() {
  try {
    const d = await (await fetch(`${API}/api/results`)).json();
    if (d.success && d.results) {
      renderComparison(d.results);
      if (d.results.saved_at) {
        const dt = new Date(d.results.saved_at);
        document.getElementById('saved-at-label').textContent =
          `Last run: ${dt.toLocaleDateString('en-GB', {day:'numeric',month:'short',year:'numeric'})} at ${dt.toLocaleTimeString('en-GB', {hour:'2-digit',minute:'2-digit'})}`;
      }
      document.getElementById('clear-btn').style.display = '';
    }
  } catch {}
}

async function clearResults() {
  try { await fetch(`${API}/api/results`, { method: 'DELETE' }); } catch {}
  document.getElementById('compare-content').innerHTML = '<span style="color:var(--muted)">Run the pipeline to see results.</span>';
  document.getElementById('tariff-select').innerHTML = '<option value="">— select tariff —</option>';
  document.getElementById('detail-content').innerHTML = '<span style="color:var(--muted)">Select a tariff above.</span>';
  document.getElementById('saved-at-label').textContent = '';
  document.getElementById('clear-btn').style.display = 'none';
  log('Comparison cleared.', 'info');
}

// ── Pipeline actions ──────────────────────────────────────────────────────

async function post(path, label, body = null) {
  log(`${label}…`, 'info');
  disableButtons(true);
  try {
    const opts = { method: 'POST' };
    if (body) { opts.headers = {'Content-Type': 'application/json'}; opts.body = JSON.stringify(body); }
    const r = await fetch(`${API}${path}`, opts);
    const d = await r.json();
    if (!r.ok || !d.success) throw new Error(d.error || r.statusText);
    return d;
  } catch (e) {
    log(`✗ ${label} failed: ${e.message}`, 'err');
    throw e;
  } finally {
    disableButtons(false);
  }
}

async function runIngest() {
  const range = getDateRange();
  const label = range.date_from && range.date_to
    ? `Ingest (${range.date_from} → ${range.date_to})`
    : 'Ingest';
  try {
    const d = await post('/ingest', label, range);
    log(`✓ Ingest: ${d.rows} rows  ${d.from?.slice(0,10)} → ${d.to?.slice(0,10)}`, 'ok');
  } catch {}
}

async function runAggregate() {
  try {
    const d = await post('/aggregate', 'Aggregate');
    log(`✓ Aggregate: ${d.intervals} intervals  ${d.from?.slice(0,10)} → ${d.to?.slice(0,10)}`, 'ok');
  } catch {}
}

async function runSimulate() {
  log('Simulating…', 'info'); disableButtons(true);
  try {
    const d = await (await fetch(`${API}/simulate`)).json();
    if (!d.success) throw new Error(d.error);
    log(`✓ Simulation complete — ${d.comparison?.length} tariff(s)`, 'ok');
    renderComparison(d); showResultMeta(d);
  } catch(e) { log(`✗ Simulate failed: ${e.message}`, 'err'); }
  finally { disableButtons(false); }
}

async function runFull() {
  const range = getDateRange();
  const label = range.date_from && range.date_to
    ? `Full pipeline (${range.date_from} → ${range.date_to})`
    : 'Full pipeline';
  log(`Starting ${label}…`, 'info'); disableButtons(true);
  try {
    const r = await fetch(`${API}/run`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(range),
    });
    const d = await r.json();
    if (!d.success) throw new Error(d.error);
    log(`✓ Pipeline complete — ${d.comparison?.length} tariff(s)`, 'ok');
    renderComparison(d); showResultMeta(d);
  } catch(e) { log(`✗ Pipeline failed: ${e.message}`, 'err'); }
  finally { disableButtons(false); }
}

function showResultMeta(d) {
  const dt = new Date(d.saved_at || new Date().toISOString());
  document.getElementById('saved-at-label').textContent =
    `Last run: ${dt.toLocaleDateString('en-GB', {day:'numeric',month:'short',year:'numeric'})} at ${dt.toLocaleTimeString('en-GB', {hour:'2-digit',minute:'2-digit'})}`;
  document.getElementById('clear-btn').style.display = '';
}

// ── Comparison render ─────────────────────────────────────────────────────

function renderComparison(data) {
  const { comparison, baseline_id } = data;
  if (!comparison?.length) return;

  const sel = document.getElementById('tariff-select');
  sel.innerHTML = comparison.map(t => `<option value="${t.tariff_id}">${t.tariff_name}</option>`).join('');

  const baseline = comparison.find(t => t.tariff_id === baseline_id) || comparison[0];
  const others   = comparison.filter(t => t.tariff_id !== baseline_id);
  const sorted   = [baseline, ...others.sort((a, b) => a.total_net_cost_gbp - b.total_net_cost_gbp)];
  const cheapest = [...comparison].sort((a, b) => a.total_net_cost_gbp - b.total_net_cost_gbp)[0];
  const maxSaving = others.length ? Math.min(...others.map(t => t.diff_vs_baseline_gbp)) : null;

  const rows = sorted.map(t => {
    const isBaseline = t.tariff_id === baseline_id;
    const diff = t.diff_vs_baseline_gbp;
    const diffStr = isBaseline
      ? '<span class="tag tag-baseline">★ Current</span>'
      : diff < 0 ? `<span class="tag tag-save">Save £${Math.abs(diff).toFixed(2)}</span>`
                 : `<span class="tag tag-cost">+£${diff.toFixed(2)}</span>`;
    return `<tr class="${isBaseline ? 'row-baseline' : ''}">
      <td><strong>${t.tariff_name}</strong></td>
      <td>£${t.total_net_cost_gbp.toFixed(2)}</td>
      <td>${t.total_import_kwh.toFixed(1)} kWh</td>
      <td>${t.total_export_kwh.toFixed(1)} kWh</td>
      <td>£${(t.total_standing_p/100).toFixed(2)}</td>
      <td>${diffStr}</td>
    </tr>`;
  }).join('');

  document.getElementById('compare-content').innerHTML = `
    <div class="summary-grid" style="margin-bottom:20px">
      <div class="metric">
        <div class="label">Period</div>
        <div class="value" style="font-size:15px">${baseline.date_from}</div>
        <div class="sub">→ ${baseline.date_to}</div>
      </div>
      <div class="metric">
        <div class="label">Intervals</div>
        <div class="value">${baseline.interval_count?.toLocaleString()}</div>
        <div class="sub">30-min billing slots</div>
      </div>
      <div class="metric">
        <div class="label">Current Tariff Cost</div>
        <div class="value">£${baseline.total_net_cost_gbp.toFixed(2)}</div>
        <div class="sub">${baseline.tariff_name}</div>
      </div>
      ${maxSaving !== null ? `<div class="metric best">
        <div class="label">Best Saving Available</div>
        <div class="value ${maxSaving < 0 ? 'diff-neg' : ''}">${maxSaving < 0 ? '−£'+Math.abs(maxSaving).toFixed(2) : '—'}</div>
        <div class="sub">vs current · ${cheapest.tariff_name}</div>
      </div>` : ''}
    </div>
    <table>
      <thead><tr><th>Tariff</th><th>Net Cost</th><th>Import</th><th>Export</th><th>Standing</th><th>vs Current</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

// ── Detail breakdown ──────────────────────────────────────────────────────

async function loadDetail() {
  const tariff = document.getElementById('tariff-select').value;
  const view   = document.getElementById('view-select').value;
  if (!tariff) return;

  document.getElementById('detail-content').innerHTML =
    '<span style="color:var(--muted)"><span id="spinner"></span>Loading…</span>';

  try {
    const d = await (await fetch(`${API}/results/${view}?tariff=${tariff}`)).json();
    if (!d.success) throw new Error(d.error);
    const records = d[view];
    if (!records?.length) {
      document.getElementById('detail-content').innerHTML = '<span style="color:var(--muted)">No data.</span>';
      return;
    }

    let colHeader, rows;

    if (view === 'daily') {
      colHeader = 'Date';
      rows = records.map(r => `<tr>
        <td>${String(r._date)}</td>
        <td>${(r.import_kwh??0).toFixed(3)}</td>
        <td>${(r.export_kwh??0).toFixed(3)}</td>
        <td>${((r.import_cost_p??0)/100).toFixed(2)}</td>
        <td>${((r.export_credit_p??0)/100).toFixed(2)}</td>
        <td>${((r.standing_p??0)/100).toFixed(2)}</td>
        <td><strong>£${(r.net_cost_gbp??0).toFixed(2)}</strong></td>
      </tr>`).join('');

    } else if (view === 'monthly') {
      colHeader = 'Month';
      rows = records.map(r => {
        const dt = new Date(r.month + 'T00:00:00');
        const label = dt.toLocaleDateString('en-GB', { month: 'short', year: 'numeric' });
        return `<tr>
          <td>${label}</td>
          <td>${(r.import_kwh??0).toFixed(3)}</td>
          <td>${(r.export_kwh??0).toFixed(3)}</td>
          <td>${((r.import_cost_p??0)/100).toFixed(2)}</td>
          <td>${((r.export_credit_p??0)/100).toFixed(2)}</td>
          <td>${((r.standing_p??0)/100).toFixed(2)}</td>
          <td><strong>£${(r.net_cost_gbp??0).toFixed(2)}</strong></td>
        </tr>`;
      }).join('');

    } else { // yearly
      colHeader = 'Year';
      rows = records.map(r => {
        const dt = new Date(r.year + 'T00:00:00');
        const label = dt.getFullYear();
        return `<tr>
          <td>${label}</td>
          <td>${(r.import_kwh??0).toFixed(1)}</td>
          <td>${(r.export_kwh??0).toFixed(1)}</td>
          <td>${((r.import_cost_p??0)/100).toFixed(2)}</td>
          <td>${((r.export_credit_p??0)/100).toFixed(2)}</td>
          <td>${((r.standing_p??0)/100).toFixed(2)}</td>
          <td><strong>£${(r.net_cost_gbp??0).toFixed(2)}</strong></td>
        </tr>`;
      }).join('');
    }

    document.getElementById('detail-content').innerHTML = `
      <table>
        <thead><tr>
          <th>${colHeader}</th>
          <th>Import kWh</th><th>Export kWh</th>
          <th>Import £</th><th>Export £</th><th>Standing £</th><th>Net £</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
  } catch(e) {
    document.getElementById('detail-content').innerHTML = `<span class="err">Error: ${e.message}</span>`;
  }
}

function disableButtons(state) { document.querySelectorAll('button').forEach(b => b.disabled = state); }

// ── Init ──────────────────────────────────────────────────────────────────

initDateRange();
checkHealth();           // triggers version check on first response
loadSavedResults();
setInterval(checkHealth, 30000);
</script>
